name: Assemble Clear POU PDFs

on:
  push:
    branches:
      - vortex-orderguard-submission
    paths:
      - .pou_upload/ready

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v4
        with:
          ref: vortex-orderguard-submission
          fetch-depth: 0

      - name: Assemble proof-of-use PDFs
        shell: bash
        run: |
          set -euo pipefail
          cat .pou_upload/replit_*.txt | tr -d '\n\r ' | base64 -d > submission/SDC2026_Vortex_Replit_POU.pdf
          cat .pou_upload/runpod_*.txt | tr -d '\n\r ' | base64 -d > submission/SDC2026_Vortex_Runpod_POU.pdf
          test -s submission/SDC2026_Vortex_Replit_POU.pdf
          test -s submission/SDC2026_Vortex_Runpod_POU.pdf
          file submission/SDC2026_Vortex_Replit_POU.pdf
          file submission/SDC2026_Vortex_Runpod_POU.pdf

      - name: Commit final PDFs and clean temporary upload data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pou_upload
          rm -f .github/workflows/assemble-pou.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: replace POU PDFs with full clear screenshots"
          git push origin HEAD:vortex-orderguard-submission
