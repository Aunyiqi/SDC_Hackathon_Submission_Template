name: Generate Vortex Submission PDFs

on:
  push:
    branches:
      - vortex-orderguard-submission
    paths:
      - scripts/generate_submission_pdfs.py
      - .github/workflows/generate-submission-pdfs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v4
        with:
          ref: vortex-orderguard-submission
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.4.4

      - name: Generate submission PDFs
        run: python scripts/generate_submission_pdfs.py

      - name: Replace starter TeamName PDFs with Vortex PDFs
        run: |
          rm -f submission/SDC2026_TeamName_Preliminary.pdf
          rm -f submission/SDC2026_TeamName_Replit_POU.pdf
          rm -f submission/SDC2026_TeamName_Runpod_POU.pdf
          rm -f submission/SDC2026_TeamName_TechDeclaration.pdf

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submission/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
            exit 0
          fi
          git commit -m "docs: add completed Vortex submission PDFs"
          git push origin HEAD:vortex-orderguard-submission
